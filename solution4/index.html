<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="exercise4.js" defer></script>
</head>

<body class="min-h-screen bg-slate-100 p-4 sm:p-8">

    <main class="max-w-6xl mx-auto">

        <!-- Header -->
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-slate-800">
                Our Products
            </h1>

            <p class="text-slate-500 mt-2">
                Browse our products and find what you need.
            </p>
        </header>

        <!-- Search -->
        <section class="bg-white p-5 rounded-xl shadow-sm mb-8">
            <label for="product-search" class="block text-sm font-semibold text-slate-700 mb-2">
                Search Products
            </label>

            <input
                type="search"
                id="product-search"
                placeholder="Search by product name..."
                class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            >
        </section>

        <!-- Product List -->
        <section>
            <h2 class="text-xl font-bold text-slate-800 mb-4">
                Available Products
            </h2>

            <div
                id="product-list"
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"
            ></div>
        </section>

        <!-- Product Details -->
        <section
            id="product-details"
            class="bg-white p-6 rounded-xl shadow-sm mt-8 text-slate-600"
        >
            Select a product to view its details.
        </section>

        <!-- Footer -->
        <footer class="text-center mt-10 text-sm text-slate-400">
            Our Products &copy; 2026
        </footer>

    </main>

</body>
</html>
