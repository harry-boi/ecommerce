<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Grade Calculator</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      .error {
        display: none;
        background-color: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
        border-radius: 12px;
        padding: 14px 16px;
        margin-top: 16px;
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
  </head>

  <body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <main class="w-full max-w-lg">
      <!-- Header -->
      <header class="text-center mb-8">
        <div
          class="inline-flex items-center justify-center w-16 h-16 bg-green-100 rounded-2xl mb-4"
        >
          <span class="text-3xl">🎓</span>
        </div>

        <h1 class="text-3xl font-bold text-slate-800">
          Student Grade Calculator
        </h1>

        <p class="text-slate-500 mt-2">
          Enter your details to calculate your academic grade.
        </p>
      </header>

      <!-- Form Card -->
      <section class="bg-white rounded-2xl shadow-lg p-6 sm:p-8">
        <form action="#" method="post" class="space-y-5" id="grade-form">
          <!-- Student Name -->
          <div>
            <label
              for="studentName"
              class="block text-sm font-semibold text-slate-700 mb-2"
            >
              Student Name
            </label>

            <input
              type="text"
              id="studentName"
              name="studentName"
              placeholder="e.g. John Doe"
              class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none transition focus:ring-2 focus:ring-green-500 focus:border-green-500"
            />
          </div>

          <!-- Score -->
          <div>
            <label
              for="score"
              class="block text-sm font-semibold text-slate-700 mb-2"
            >
              Student Score
            </label>

            <input
              type="number"
              id="score"
              name="score"
              placeholder="Enter score (0–100)"
              class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none transition focus:ring-2 focus:ring-green-500 focus:border-green-500"
            />

            <p class="text-xs text-slate-400 mt-2">
              Enter a score between 0 and 100.
            </p>
          </div>

          <!-- Calculate Button -->
          <button
            type="submit"
            class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-md hover:shadow-lg"
          >
            Calculate Grade
          </button>
        </form>

        <!-- Results Section -->
        <div class="mt-8 pt-6 border-t border-slate-200">
          <h2 class="text-lg font-bold text-slate-800 mb-4">Grade Results</h2>

          <div class="bg-slate-50 rounded-xl p-5 space-y-4">
            <div class="flex justify-between items-center gap-4">
              <span class="text-sm text-slate-500">Student Name</span>
              <span
                id="resultName"
                class="text-sm font-semibold text-slate-800"
              >
                ---
              </span>
            </div>

            <div class="flex justify-between items-center gap-4">
              <span class="text-sm text-slate-500">Score</span>
              <span
                id="resultScore"
                class="text-sm font-semibold text-slate-800"
              >
                ---
              </span>
            </div>

            <div class="flex justify-between items-center gap-4">
              <span class="text-sm text-slate-500">Grade</span>
              <span
                id="resultGrade"
                class="inline-flex items-center justify-center min-w-12 px-4 py-2 bg-green-100 text-green-700 font-bold rounded-lg"
              >
                ---
              </span>
            </div>
          </div>
        </div>
      </section>

      <!-- Grading Guide -->
      <section class="mt-6 bg-white rounded-2xl shadow-sm p-6">
        <h2 class="font-bold text-slate-800 mb-4">Grading Guide</h2>

        <div class="grid grid-cols-2 gap-3">
          <div class="flex justify-between bg-green-50 p-3 rounded-lg">
            <span class="text-sm text-slate-600">70–100</span>
            <span class="text-sm font-bold text-green-700">A</span>
          </div>

          <div class="flex justify-between bg-blue-50 p-3 rounded-lg">
            <span class="text-sm text-slate-600">60–69</span>
            <span class="text-sm font-bold text-blue-700">B</span>
          </div>

          <div class="flex justify-between bg-yellow-50 p-3 rounded-lg">
            <span class="text-sm text-slate-600">50–59</span>
            <span class="text-sm font-bold text-yellow-700">C</span>
          </div>

          <div class="flex justify-between bg-orange-50 p-3 rounded-lg">
            <span class="text-sm text-slate-600">45–49</span>
            <span class="text-sm font-bold text-orange-700">D</span>
          </div>

          <div class="flex justify-between bg-red-50 p-3 rounded-lg">
            <span class="text-sm text-slate-600">0–44</span>
            <span class="text-sm font-bold text-red-700">F</span>
          </div>
        </div>
      </section>

      <!-- Footer -->
      <footer class="text-center mt-6 text-sm text-slate-400">
        Student Grade Calculator &copy; 2026
      </footer>
    </main>

    <script src="./grade.js"></script>
  </body>
</html>
